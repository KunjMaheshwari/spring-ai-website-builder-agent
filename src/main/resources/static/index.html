<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <meta
            name="description"
            content="Tomato Support - AI powered customer support"
    >

    <title>Tomato Support</title>

    <link
            rel="stylesheet"
            href="style.css"
    >

</head>


<body>

<div class="app">


    <!-- =================================================
         HEADER
    ================================================== -->

    <header class="header">

        <div class="header-content">

            <div class="brand">

                <div
                        class="logo"
                        aria-hidden="true"
                >
                    🍅
                </div>

                <div class="brand-text">

                    <h1>
                        Tomato Support
                    </h1>

                    <p>
                        Customer Support Assistant
                    </p>

                </div>

            </div>


            <div
                    class="status"
                    aria-label="Tomato Support is online"
            >

                <span
                        class="status-dot"
                        aria-hidden="true"
                ></span>

                <span>
                    Online
                </span>

            </div>

        </div>

    </header>



    <!-- =================================================
         CHAT AREA
    ================================================== -->

    <main
            class="chat-container"
            aria-label="Tomato Support conversation"
    >

        <div class="chat-content">


            <!-- ================= DATE ================= -->

            <div class="date-divider">
                <span>
                    Today
                </span>
            </div>



            <!-- ================= WELCOME MESSAGE ================= -->

            <div class="message-row bot-row">

                <div
                        class="avatar bot-avatar"
                        aria-hidden="true"
                >
                    🍅
                </div>


                <div class="message-wrapper">

                    <div class="sender-name">
                        Tomato Support
                    </div>


                    <div class="message bot-message">

                        <p>
                            Hi! Welcome to Tomato Support 🍅
                        </p>

                        <p>
                            How can I help you with your order today?
                        </p>

                    </div>


                    <div class="message-time">
                        Just now
                    </div>

                </div>

            </div>



            <!-- =================================================
                 DYNAMIC CHAT MESSAGES

                 JavaScript will append:
                 - User messages
                 - Typing indicator
                 - Streaming AI response
            ================================================== -->

            <div
                    id="chatMessages"
                    aria-live="polite"
                    aria-atomic="false"
            ></div>


        </div>

    </main>



    <!-- =================================================
         INPUT AREA
    ================================================== -->

    <footer class="input-section">

        <div class="input-container">


            <form
                    id="chatForm"
                    class="chat-form"
                    autocomplete="off"
            >

                <div class="input-wrapper">

                    <input
                            id="messageInput"
                            type="text"
                            placeholder="Type your message..."
                            autocomplete="off"
                            maxlength="1000"
                            aria-label="Type your message"
                            required
                    >


                    <span
                            id="characterCount"
                            class="character-count"
                            aria-live="polite"
                    >
                        0/1000
                    </span>

                </div>


                <button
                        id="sendButton"
                        type="submit"
                        class="send-button"
                        aria-label="Send message"
                >

                    <span class="send-text">
                        Send
                    </span>

                    <span
                            class="send-icon"
                            aria-hidden="true"
                    >
                        ➤
                    </span>

                </button>

            </form>


            <div class="input-hint">

                Tomato Support can help with
                orders, refunds, tracking and policies.

            </div>

        </div>

    </footer>



    <!-- =================================================
         TOAST NOTIFICATION
    ================================================== -->

    <div
            id="toast"
            class="toast"
            role="alert"
            aria-live="assertive"
    ></div>


</div>



<!-- =================================================
     JAVASCRIPT
================================================== -->

<script src="script.js"></script>


</body>

</html>
